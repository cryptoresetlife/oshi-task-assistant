<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>接入已登录 Chrome</title><link rel="stylesheet" href="popup.css"><script defer src="popup.js"></script><body><h2>接入已登录 Chrome</h2><p>使用当前 Chrome 配置的登录状态，在当前窗口创建工作标签页。无需重新登录或重启。</p><label>助手地址<input id="address" value="http://127.0.0.1:18745"></label><label>连接码<input id="token" type="password" autocomplete="off" placeholder="从助手页面复制"></label><label>环境名称<input id="name" value="已登录 Chrome（扩展）"></label><button id="connect">连接当前 Chrome</button><button id="disconnect">断开</button><p id="status" role="status">未连接</p><small>连接后回助手点“刷新环境”，选择扩展环境。Chrome 的调试提示条是正常提示，点取消会停止当前工作标签页。不会导出 Cookie。</small></body></html>
